name: Vider les colonnes de liens

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "CSV à vider"
        required: false
        default: "agences_independantes.csv"
      tout:
        description: "Vider aussi lien_pappers (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  vider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vider
        env:
          FICHIER: ${{ github.event.inputs.fichier }}
          TOUT: ${{ github.event.inputs.tout }}
        run: |
          OPTS=""
          if [ "$TOUT" = "true" ]; then OPTS="--tout"; fi
          python vider_colonnes.py "$FICHIER" $OPTS
      - name: Commit et push
        env:
          FICHIER: ${{ github.event.inputs.fichier }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$FICHIER"
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Colonnes de liens vidées"
            git push
          fi
