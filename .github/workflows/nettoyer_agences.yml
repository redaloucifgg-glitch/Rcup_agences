name: Nettoyer les agences (indépendantes)

on:
  workflow_dispatch:
    inputs:
      seuil:
        description: "Gérant retiré s'il dirige N sociétés ou plus"
        required: false
        default: "5"
      avec_nom:
        description: "Retirer aussi les noms contenant un réseau (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  nettoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nettoyer
        env:
          SEUIL: ${{ github.event.inputs.seuil }}
          AVEC_NOM: ${{ github.event.inputs.avec_nom }}
        run: |
          OPTS="--seuil $SEUIL"
          if [ "$AVEC_NOM" = "true" ]; then OPTS="$OPTS --avec-nom"; fi
          python nettoyer_agences.py $OPTS | tee resultat.txt
          {
            echo '## Nettoyage des agences'
            echo '```'
            cat resultat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add motifs_reseaux.txt agences_independantes.csv agences_retirees.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Nettoyage des agences"
            git push
          fi
