name: Nettoyer les agences (indépendantes)

on:
  workflow_dispatch:
    inputs:
      seuil:
        description: "Gérant retiré s'il dirige N sociétés ou plus"
        required: false
        default: "5"
        type: string

      avec_nom:
        description: "Retirer aussi les noms contenant un réseau (true/false)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  nettoyer:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Récupérer le dépôt
      # --------------------------------------------------
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Installer Python
      # --------------------------------------------------
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Exécuter le nettoyage
      # --------------------------------------------------
      - name: Nettoyer les agences
        env:
          SEUIL: ${{ inputs.seuil }}
          AVEC_NOM: ${{ inputs.avec_nom }}
        run: |
          set -e

          echo "========================================"
          echo "NETTOYAGE DES AGENCES"
          echo "========================================"
          echo "Seuil gérant : $SEUIL"
          echo "Filtrage des noms : $AVEC_NOM"
          echo "========================================"

          OPTS="--seuil $SEUIL"

          if [ "$AVEC_NOM" = "true" ]; then
            OPTS="$OPTS --avec-nom"
          fi

          python nettoyer_agences.py $OPTS | tee resultat.txt

          echo ""
          echo "========================================"
          echo "RÉSULTAT"
          echo "========================================"

          cat resultat.txt

          {
            echo '## Nettoyage des agences'
            echo ''
            echo "**Seuil gérant :** $SEUIL"
            echo ''
            echo "**Retrait des réseaux dans le nom :** $AVEC_NOM"
            echo ''
            echo '```text'
            cat resultat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------
      # 4. Vérifier les fichiers créés
      # --------------------------------------------------
      - name: Vérifier les fichiers générés
        run: |
          echo "========================================"
          echo "FICHIERS GÉNÉRÉS"
          echo "========================================"

          ls -lah

          echo ""
          echo "========================================"
          echo "motifs_reseaux.txt"
          echo "========================================"

          if [ -f motifs_reseaux.txt ]; then
            echo "Fichier trouvé."
            echo ""
            cat motifs_reseaux.txt
          else
            echo "motifs_reseaux.txt absent."
          fi

          echo ""
          echo "========================================"
          echo "agences_independantes.csv"
          echo "========================================"

          if [ -f agences_independantes.csv ]; then
            echo "Fichier trouvé."
            wc -l agences_independantes.csv
          else
            echo "Fichier absent."
          fi

          echo ""
          echo "========================================"
          echo "agences_retirees.csv"
          echo "========================================"

          if [ -f agences_retirees.csv ]; then
            echo "Fichier trouvé."
            wc -l agences_retirees.csv
          else
            echo "Fichier absent."
          fi

      # --------------------------------------------------
      # 5. Commit et push des fichiers
      # --------------------------------------------------
      - name: Commit et push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "========================================"
          echo "FICHIERS À AJOUTER"
          echo "========================================"

          git add motifs_reseaux.txt
          git add agences_independantes.csv
          git add agences_retirees.csv

          echo ""
          echo "========================================"
          echo "ÉTAT GIT"
          echo "========================================"

          git status --short

          if git diff --cached --quiet; then
            echo ""
            echo "Aucun changement à commit."
          else
            git commit -m "Nettoyage des agences"
            git push

            echo ""
            echo "========================================"
            echo "PUSH TERMINÉ"
            echo "========================================"
          fi

