name: Analyser les agences indépendantes

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "CSV à analyser"
        required: false
        default: "agences_independantes.csv"

permissions:
  contents: write

# un seul workflow à la fois sur les données : les autres attendent leur tour
concurrency:
  group: agences-donnees
  cancel-in-progress: false

jobs:
  analyser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyser
        env:
          FICHIER: ${{ github.event.inputs.fichier }}
        run: |
          python analyser_independantes.py "$FICHIER" | tee analyse_independantes.txt
          {
            echo '## Agences indépendantes'
            echo '```'
            cat analyse_independantes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in analyse_independantes.txt effectifs_repartition.csv reseaux_candidats_independantes.csv; do
            if [ -f "$f" ]; then
              git add -f "$f"
            else
              echo "Fichier absent, ignoré : $f"
            fi
          done
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "Analyse des agences indépendantes"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push refusé (essai $i/5), nouvel essai..."
            sleep $((i * 5))
          done
          echo "Push impossible."
          exit 1
          
