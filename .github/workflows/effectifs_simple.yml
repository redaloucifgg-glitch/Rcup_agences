name: Récupérer les effectifs

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "CSV à enrichir"
        required: false
        default: "agences_independantes.csv"
      echantillon:
        description: "Nombre de lignes à traiter (0 = toutes)"
        required: false
        default: "50"
      workers:
        description: "Requêtes en parallèle (le débit est plafonné par rate)"
        required: false
        default: "20"
      rate:
        description: "Appels par seconde, tous workers confondus (max 7)"
        required: false
        default: "6"
      duree_max:
        description: "Durée maximale du run en minutes (puis arrêt propre et sauvegarde)"
        required: false
        default: "330"

permissions:
  contents: write

# un seul workflow à la fois sur les données : les autres attendent leur tour
concurrency:
  group: agences-donnees
  cancel-in-progress: false

jobs:
  effectifs:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer requests
        run: pip install requests
      - name: Récupérer les effectifs
        env:
          FICHIER: ${{ github.event.inputs.fichier }}
          ECHANTILLON: ${{ github.event.inputs.echantillon }}
          WORKERS: ${{ github.event.inputs.workers }}
          RATE: ${{ github.event.inputs.rate }}
          DUREE_MAX: ${{ github.event.inputs.duree_max }}
        run: |
          python recuperer_effectifs.py "$FICHIER" --echantillon "$ECHANTILLON" --workers "$WORKERS" --rate "$RATE" --duree-max "$DUREE_MAX" | tee resultat.txt
          {
            echo '## Effectifs'
            echo '```'
            cat resultat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sauvegarde de secours du fichier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fichier-effectifs
          path: ${{ github.event.inputs.fichier }}
          retention-days: 7
      - name: Commit et push
        if: always()
        env:
          FICHIER: ${{ github.event.inputs.fichier }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "$FICHIER" ]; then
            git add -f "$FICHIER"
          else
            echo "Fichier absent : $FICHIER"
          fi
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "Effectifs ajoutés"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push refusé (essai $i/5), nouvel essai..."
            sleep $((i * 5))
          done
          echo "Push impossible : récupère le fichier dans les artifacts du run."
          exit 1
          
