name: Compter, dédoublonner et analyser les agences

on:
  workflow_dispatch:
    inputs:
      filtrer:
        description: "Retirer aussi les sans gérant et les gérants trop gros (true/false)"
        required: false
        default: "false"
      seuil:
        description: "Gérant retiré s'il dirige N sociétés ou plus (avec filtrer)"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  analyser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyser
        env:
          FILTRER: ${{ github.event.inputs.filtrer }}
          SEUIL: ${{ github.event.inputs.seuil }}
        run: |
          OPTS=""
          if [ "$FILTRER" = "true" ]; then OPTS="--filtrer --seuil $SEUIL"; fi
          python compter_agences.py $OPTS | tee resultat.txt
          {
            echo '## Agences'
            echo '```'
            cat resultat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agences_uniques.csv reseaux_candidats.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Agences uniques et réseaux candidats"
            git push
          fi
          
